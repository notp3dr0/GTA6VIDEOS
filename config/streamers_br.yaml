# ==============================================================================
# RADAR DE STREAMERS BRASILEIROS (LIVES & VODS DE GTA VI — YOUTUBE + TWITCH)
# ==============================================================================
# FASE 1 (19/11 01:00 BRT -> 20/11 01:57 BRT — Campanha Real Oficial):
#   - Fonte ÚNICA permitida na campanha: https://www.youtube.com/watch?v=KY4DWumZffg
#   - Foco BR dentro da live oficial: Skorpion & Gamer Costa (07:04-08:10 s/ Samira Close)
#     e Gameplay PT-BR do Skorpion (22:30-22:57 BRT, Turbo 3x) + cortes dublados/legendados PT-BR.
#
# FASE 2 (A partir de 20/11 02:00 BRT — Pós-Live / Dias 2 a 5 fora de casa):
#   - O ScoutAgent varre automaticamente via `yt-dlp` as lives ativas (`/live` e Twitch)
#     e os VODs/transmissões recentes (`/streams` e `videos?filter=archives`) APENAS
#     destes streamers brasileiros jogando GTA VI!
#   - Bloqueio automático de vídeos de GTA 5 RP, Roblox ou outros jogos.
# ==============================================================================

capture_settings:
  clip_duration_sec: 25.0
  live_edge_capture_enabled: true
  dvr_rewind_from_live_edge_sec: 40.0
  vod_hot_moments_offsets_sec: [180, 600, 1200, 2400, 3600]
  auto_whisper_transcribe_ptbr: true   # Usa Groq Whisper (whisper-large-v3-turbo) ou OpenAI Whisper se houver chave no .env
  strict_gta6_only_filter: true        # Ignora lives/vídeos de GTA 5 RP, CS2, Roblox, etc.

