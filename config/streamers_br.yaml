# ==============================================================================
# RADAR DE STREAMERS BRASILEIROS (LIVES & VODS DE GTA VI — YOUTUBE + TWITCH)
# ==============================================================================
# FASE 1 (19/11 01:00 BRT -> 20/11 01:57 BRT — Campanha Real Oficial):
#   - Fonte ÚNICA permitida na campanha: https://www.youtube.com/watch?v=KY4DWumZffg
#   - Foco BR dentro da live oficial: Skorpion & Gamer Costa (07:04-08:10 s/ Samira Close)
#     e Gameplay PT-BR do Skorpion (22:30-22:57 BRT, Turbo 3x) + cortes dublados/legendados PT-BR.
#
# FASE 2 (A partir de 20/11 02:00 BRT — Pós-Live / Dias 2 a 5 fora de casa):
#   - O ScoutAgent varre automaticamente via `yt-dlp` as lives ativas (`/live` e Twitch)
#     e os VODs/transmissões recentes (`/streams` e `videos?filter=archives`) APENAS
#     destes streamers brasileiros jogando GTA VI!
#   - Bloqueio automático de vídeos de GTA 5 RP, Roblox ou outros jogos.
# ==============================================================================

capture_settings:
  clip_duration_sec: 25.0
  live_edge_capture_enabled: true
  dvr_rewind_from_live_edge_sec: 40.0
  vod_intro_skip_sec: 180
  vod_hot_moments_offsets_sec: [180, 420, 660, 960, 1320, 1800, 2400, 3000, 3600]
  vod_rolling_step_sec: 240                 # Gera novos cortes inéditos a cada 4 min ao longo de VODs de 2h–10h
  max_unseen_slices_per_vod_per_scan: 8     # Mantém os 5 canais (60 cortes/dia) abastecidos sempre pelos VODs mais novos
  recency_priority_enabled: true            # Ordena SEMPRE pelos mais atuais: Live Ao Vivo (0m) -> VOD <3h -> VOD <12h -> VOD <24h
  max_vod_age_hours: 72                     # Descarta VODs com mais de 72h (nunca posta conteúdo velho)
  min_vod_upload_date: "2026-11-18"         # Descarta vídeos antigos anteriores à semana de lançamento
  playlist_scan_depth: 5                    # Inspeciona os 5 itens mais recentes de /streams, /videos e Twitch archives
  vod_radar_interval_minutes: 30            # Varredura automática a cada 30 min atrás de novos VODs recém-encerrados
  auto_whisper_transcribe_ptbr: true        # Usa Groq Whisper (whisper-large-v3-turbo) ou OpenAI Whisper se houver chave no .env
  strict_gta6_only_filter: true             # Ignora lives/vídeos de GTA 5 RP, CS2, Roblox, etc.
  live_hype_monitor:
    enabled: true                           # Monitor de picos ao vivo estilo Real Oficial / OpusClip Live
    poll_interval_sec: 20                   # Checa novos blocos de 6s do buffer circular a cada 20s
    ring_segment_sec: 6                     # Fatias de 6s em disco (-segment_wrap 24 = máx ~2.4 min / ~80 MB em SSD)
    ring_wrap_segments: 24                  # Nunca enche o HD do 2º PC nos 5 dias
    retroactive_lookback_sec: 25            # Clipa ~18s ANTES do grito/risada + ~7s da reação!
    spike_threshold: 58.0                   # Score mínimo [0..100] somando pico de voz/risada (dB) + ação visual + chat ("CLIPA"/"KKKK")
    min_minutes_between_instant_clips: 8.0  # Cooldown anti-spam entre clipes instantâneos


