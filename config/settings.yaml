page:
  name: "Radar Leonida Cortes"
  handle: "radarleonidacortes"
  bio: "Os melhores cortes de lives de GTA VI em tempo real. Página de fãs, sem afiliação oficial."
  niche_angle: "cortes em tempo real de lives de streamers jogando GTA VI"
  primary_language: "pt-BR"
  secondary_language: "pt-BR"
  timezone: "America/Sao_Paulo"
  awake_hours_start: 8
  awake_hours_end: 23
  gta6_launch_date: "2026-11-19"
  content_focus: "streamer_live_clips_only"

platforms:
  instagram_reels:
    enabled: true
    daily_posts: 12
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 90
    max_hashtags: 1
  tiktok:
    enabled: true
    daily_posts: 12
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 60
  youtube_shorts:
    enabled: false   # Desativado durante a campanha (campanha paga apenas TikTok + Instagram!)
    daily_posts: 0
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 58
  x:
    enabled: false
    daily_posts: 0
  threads:
    enabled: false
    daily_posts: 0

video_pipeline:
  target_width: 1080
  target_height: 1920
  fps: 30
  video_codec: "libx264"
  audio_codec: "aac"
  crf: 20
  min_clip_sec: 10
  max_clip_sec: 45
  layout_mode: "blur_pad_hud"
  auto_react_split_screen: true  # Detecta webcam do streamer e ativa split-screen 9:16 (730px cam + 1190px gameplay)
  caption_style_mode: "kinetic_word"  # Legendas palavra-por-palavra com destaque animado na cor do canal + filtro anti-palavrao
  burn_captions: true
  burn_hook_banner: true
  burn_credit_watermark: false  # REGRA #10 DA CAMPANHA: PROIBIDO logo ou marca d'agua na tela!
  hook_duration_sec: 2.0        # "Prenda nos 2 primeiros segundos e legende as falas"
  loudnorm_lufs: -14.0

approval_rules:
  require_approval_for_rumors: true
  require_approval_outside_pillars: false
  require_approval_credit_spend: true
  min_interval_minutes_same_platform: 75
  auto_publish_verified_clips: true
