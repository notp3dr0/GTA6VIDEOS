page:
  name: "GTA 6 Fast Clips"
  handle: "gta6fastclips"
  bio: "GTA 6 news, tips & best clips, fast. Fan page, not affiliated with Rockstar Games."
  niche_angle: "tips, hidden details and fast official news"
  primary_language: "pt-BR"     # pt-BR (foco Real Oficial Brasil) | en-US | bilingual
  secondary_language: "en-US"
  timezone: "America/Sao_Paulo"
  awake_hours_start: 9
  awake_hours_end: 23
  gta6_launch_date: "2026-11-19" # Ajuste para modo pre-launch (countdown) ou post-launch (Day X in Leonida)

platforms:
  youtube_shorts:
    enabled: true
    daily_posts: 3
    slots: ["11:30", "16:30", "20:30"]
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 58
    default_clip_duration_sec: 28
  instagram_reels:
    enabled: true
    daily_posts: 2
    slots: ["12:00", "19:30"]
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 90
    max_hashtags: 5
  tiktok:
    enabled: true
    daily_posts: 3
    slots: ["11:45", "17:00", "21:00"]
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    max_duration_sec: 60
  x:
    enabled: true
    daily_posts: 6
    slots:
      - time: "08:30"
        pillar: "official_news"
      - time: "10:30"
        pillar: "tips_tutorials"
      - time: "13:00"
        pillar: "gameplay_clips"
      - time: "15:30"
        pillar: "gta5_nostalgia"
      - time: "18:30"
        pillar: "spotlights"
      - time: "21:30"
        pillar: "countdown_recap"
  threads:
    enabled: false
    daily_posts: 2
    slots: ["12:30", "20:00"]

video_pipeline:
  target_width: 1080
  target_height: 1920
  fps: 30
  video_codec: "libx264"
  audio_codec: "aac"
  crf: 20
  min_clip_sec: 8
  max_clip_sec: 32
  layout_mode: "blur_pad_hud"   # blur_pad_hud (preserva HUD 16:9 c/ fundo blur) | smart_crop (corte 9:16 cheio)
  burn_captions: true
  burn_hook_banner: true
  hook_duration_sec: 2.5
  loudnorm_lufs: -14.0

approval_rules:
  require_approval_for_rumors: true
  require_approval_outside_pillars: true
  require_approval_credit_spend: true
  min_interval_minutes_same_platform: 150
  auto_publish_verified_clips: true
