# ==============================================================================
# MATRIZ DE 5 PÁGINAS PT-BR DE CORTES DE LIVES (GTA VI & CAMPANHA REAL OFICIAL)
# Escala: 5 Contas x 12 Cortes/Dia = 60 Cortes/Dia por Rede (até 120 posts/dia em TikTok + Instagram Reels!)
# Fuso Horário: America/Sao_Paulo (BRT, UTC-3)
#
# PLANO DE GUERRA — FASE 1 vs FASE 2:
# 1) DURANTE A LIVE OFICIAL (19/11 01:00 BRT -> 20/11 02:00 BRT — 25 Horas):
#    - Fonte 100% exclusiva: https://www.youtube.com/watch?v=KY4DWumZffg
#    - Plataformas válidas que pagam (R$ 4,00 / 1k views > 5k views): TikTok + Instagram Reels
#    - ZERO logo do canal e ZERO marca d'água na tela (`burn_credit_watermark: false`)
#    - Legenda obrigatória: "Assista ao vivo em youtube.com/youtube" + ÚNICA hashtag `#launchdayonYT`
#    - 1º comentário fixado obrigatório: "Assista em https://www.youtube.com/watch?v=KY4DWumZffg"
#    - Escudos ativos: Blackout em Samira Close (07:04-08:10) e The Burnt Peanut (20:03-20:30)
#    - Turbo máximo na Gameplay PT-BR do Skorpion (22:30-22:57) e Horário Nobre (19:00-00:00)
#    - PROIBIDO comparações com jogos antigos da franquia ou críticas/memes negativos!
#
# 2) PÓS-LIVE (A partir de 20/11 02:00 BRT — Dias 3 a 5 fora de casa):
#    - Hard stop imediato nos envios da campanha (protegendo a janela de +48h até 22/11 02:00 BRT)
#    - As 5 páginas viram automaticamente para Cortes de Lives de Streamers PT-BR de GTA VI
#      (@Skorpion, @GamerCosta, @alanzoka, @loud_coringa, @PaulinhooLoko, @FunkyBlackCat, @Gaules)
#
# BLINDAGEM ANTI-SHADOWBAN & AUDITORIA:
# - Cada conta possui identidade editorial própria, voz neural PT-BR distinta (p/ dublagens),
#   layout 9:16 (`blur_pad_hud` vs `smart_crop`), cor de destaque nas legendas `.ass`,
#   preset de cor, CRF e micro-trim determinístico (`+0.4s * channel_idx`), garantindo
#   hashes MP4, waveforms de áudio e frames 100% exclusivos.
# - Trava atômica `channel_segment_locks` no SQLite impede que dois canais usem o mesmo
#   trecho da live ou de qualquer vídeo no mesmo dia.
# - Pool OAuth duplo (`youtube_quota_pool`) mantido pronto para expansão futura no Shorts
#   pós-campanha (6 uploads no `project_a` + 6 no `project_b` = 12/dia sem HTTP 403).
# ==============================================================================

global_scaling:
  timezone: "America/Sao_Paulo"
  total_channels: 5
  videos_per_channel_per_day: 12
  total_daily_videos: 60
  total_5day_videos: 300
  min_spacing_minutes_per_channel: 90
  cross_channel_stagger_minutes: 15
  warmup_strategy: "full_12"
  warmup_strategies_catalog:
    full_12:
      description: "12 cortes/conta/dia imediatos (60 cortes/dia por rede, até 120 posts/dia em TikTok + Reels)."
      daily_cap_by_day: [12, 12, 12, 12, 12]
    safe_ramp_6_to_12:
      description: "Rampa gradual para contas recém-criadas (Dia 1-2: 6/dia, Dia 3: 8/dia, Dia 4: 10/dia, Dia 5+: 12/dia)."
      daily_cap_by_day: [6, 6, 8, 10, 12]
  anti_shadowban:
    forbid_same_day_segment_overlap: true
    micro_trim_offset_step_sec: 0.4
    unique_visual_and_audio_fingerprint: true
    campaign_slug: "gta-vi-youtube"
    authorized_live_video_id: "KY4DWumZffg"
    zero_logos_or_watermarks: true
    campaign_platforms:
      - "tiktok"
      - "instagram_reels"

channels:
  - channel_id: "ch1_plantao_oficial"
    channel_idx: 0
    name: "Cortes Live Leonida"
    handle: "@cortesliveleonida"
    editorial_angle: "Melhores Reações Ao Vivo & Momentos Insanos da Live"
    language: "pt-BR"
