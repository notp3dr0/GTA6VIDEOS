    tts_pitch: "+0Hz"
    layout: "blur_pad_hud"
    subtitle_accent: "cyan"
    subtitle_accent_ass_bgr: "&H00FFFF00"
    preferred_ai_thinker: "claude_pro"
    color_grade_preset: "broadcast_crisp_cyan"
    ffmpeg_crf: 19
    pillars:
      - "real_oficial_campaign"
      - "gameplay_clips"
      - "official_news"
    stagger_minutes: 0
    daily_slots_brt:
