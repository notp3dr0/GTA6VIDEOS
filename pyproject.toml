[project]
name = "gta6-agents"
version = "1.0.0"
description = "Autonomous Multi-Agent System for Faceless GTA 6 Clipping Page & Real Oficial GTA VI YouTube Championship"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "yt-dlp>=2024.10.0",
    "edge-tts>=6.1.12",
    "youtube-transcript-api>=0.6.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "apscheduler>=3.10.4",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
youtube = [
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
gta6-agents = "gta6_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta6_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
